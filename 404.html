<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Gohil Parth Arvindbhai</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .not-found-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
      position: relative;
      z-index: 2;
    }
    .not-found-card {
      max-width: 580px;
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-lg);
      padding: 48px 36px;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow-lg), var(--glow-blue);
    }
    .code-error {
      font-family: var(--font-mono);
      font-size: clamp(4.5rem, 12vw, 7rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff, var(--accent-blue), var(--accent-blue-deep));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .not-found-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
    }
    .not-found-desc {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .not-found-btns {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="ambient-glow glow-top-left" aria-hidden="true"></div>
  <div class="ambient-glow glow-bottom-right" aria-hidden="true"></div>
  <div class="ambient-grid-overlay" aria-hidden="true"></div>

  <main class="not-found-wrapper">
    <div class="not-found-card">
      <div class="brand-badge" style="margin: 0 auto 20px auto;">PG</div>
      <div class="code-error">404</div>
      <h1 class="not-found-title">Page Not Found</h1>
      <p class="not-found-desc">
        The page you are looking for doesn't exist or has been moved. Let's get you back to the main portfolio.
      </p>
      <div class="not-found-btns">
        <a href="index.html" class="btn btn-primary">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Return Home</span>
        </a>
        <a href="https://github.com/gohilparth439" target="_blank" rel="noopener noreferrer" class="btn btn-github">
          <span>GitHub Profile</span>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
